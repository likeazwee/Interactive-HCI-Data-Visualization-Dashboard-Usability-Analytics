
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analitik Pelayanan Publik (HCI & Viz)</title>
    <script src="[https://cdn.plot.ly/plotly-latest.min.js](https://cdn.plot.ly/plotly-latest.min.js)"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F7FAFC;
            margin: 0;
            padding: 20px;
            color: #2D3748;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            color: #1A202C;
            font-size: 26px;
        }
        .header p {
            color: #718096;
            margin-top: 5px;
        }
        .kpi-container {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 200px;
            border-left: 5px solid #3182CE;
        }
        .kpi-card h3 {
            margin: 0;
            font-size: 13px;
            color: #718096;
            text-transform: uppercase;
        }
        .kpi-card p {
            margin: 10px 0 0 0;
            font-size: 24px;
            font-weight: bold;
            color: #2B6CB0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .full-width {
            grid-column: span 2;
        }
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>

        <div class="kpi-card" style="border-left-color: #D69E2E;">

        <div class="kpi-card" style="border-left-color: #319795;">
            <h3>Rata-Rata Respon</h3>
            <p>24.0 Jam</p>
        </div>
        <div class="kpi-card" style="border-left-color: #38A169;">
            <h3>Tingkat Selesai</h3>
            <p>70.0%</p>
        </div>
    </div>

    <!-- Charts Grid Section -->
    <div class="grid-container">
        <div class="chart-card full-width">
            <div id="chart-line"></div>
        </div>
        <div class="chart-card">
